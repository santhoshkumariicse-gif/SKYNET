apiVersion: apps/v1
kind: Deployment
metadata:
  name: skynet-backend
  namespace: skynet
  labels:
    app: skynet-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: skynet-backend
  template:
    metadata:
      labels:
        app: skynet-backend
    spec:
      containers:
        - name: backend
          image: skynet-registry.internal/skynet/backend:v5.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: skynet-config
            - secretRef:
                name: skynet-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2048Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: skynet-backend
  namespace: skynet
spec:
  type: ClusterIP
  selector:
    app: skynet-backend
  ports:
    - port: 8000
      targetPort: 8000
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skynet-frontend
  namespace: skynet
  labels:
    app: skynet-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: skynet-frontend
  template:
    metadata:
      labels:
        app: skynet-frontend
    spec:
      containers:
        - name: frontend
          image: skynet-registry.internal/skynet/frontend:v5.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: skynet-frontend
  namespace: skynet
spec:
  type: ClusterIP
  selector:
    app: skynet-frontend
  ports:
    - port: 3000
      targetPort: 3000
      name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: skynet-ingress
  namespace: skynet
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "skynet-backend"
spec:
  tls:
    - hosts:
        - soc.skynet.internal
      secretName: skynet-tls-cert
  rules:
    - host: soc.skynet.internal
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: skynet-backend
                port:
                  number: 8000
          - path: /rag
            pathType: Prefix
            backend:
              service:
                name: skynet-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: skynet-frontend
                port:
                  number: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: skynet-backend-hpa
  namespace: skynet
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: skynet-backend
  minReplicas: 3
  maxReplicas: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
