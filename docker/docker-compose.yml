version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: skynet-postgres
    restart: always
    environment:
      POSTGRES_USER: skynet_admin
      POSTGRES_PASSWORD: skynet_secure_password_2026
      POSTGRES_DB: skynet_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skynet_admin -d skynet_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: skynet-redis
    restart: always
    command: redis-server --requirepass skynet_redis_2026
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "skynet_redis_2026", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: skynet-backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://skynet_admin:skynet_secure_password_2026@postgres:5432/skynet_db
      REDIS_URL: redis://:skynet_redis_2026@redis:6379/0
      SECRET_KEY: skynet_super_secret_jwt_key_enterprise_2026_prod_change_me
      AGENT_API_KEY: skynet_agent_default_secret_token_2026
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    container_name: skynet-dashboard
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  n8n:
    image: n8nio/n8n:latest
    container_name: skynet-n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  postgres_data:
  redis_data:
  n8n_data:
