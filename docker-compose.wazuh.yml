version: '3.8'

# ==============================================================================
# SKYNET v5.0 — Official Wazuh XDR & SIEM Cluster Stack
# Includes: Wazuh Manager (v4.9.0), Wazuh Indexer, and Wazuh SOC Dashboard
# ==============================================================================

services:
  wazuh.manager:
    image: wazuh/wazuh-manager:4.9.0
    container_name: skynet-wazuh-manager
    restart: unless-stopped
    ports:
      - "1514:1514/tcp"  # Agent communication protocol
      - "1515:1515/tcp"  # Agent enrollment service (authd)
      - "514:514/udp"    # Syslog forwarder receiver
      - "55000:55000/tcp"# Wazuh REST API Gateway (integrated with SKYNET)
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USER=admin
      - INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD:-SecretPassword123!}
      - FILEBEAT_SSL_VERIFICATION=false
      - SSL_VERIFICATION=false
    volumes:
      - wazuh_api_config:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
    networks:
      - skynet-wazuh-net

  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.9.0
    container_name: skynet-wazuh-indexer
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - network.host=0.0.0.0
      - discovery.type=single-node
      - plugins.security.ssl.http.enabled=true
      - plugins.security.disabled=false
      - INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD:-SecretPassword123!}
    volumes:
      - wazuh_indexer_data:/var/lib/wazuh-indexer
    networks:
      - skynet-wazuh-net

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.9.0
    container_name: skynet-wazuh-dashboard
    restart: unless-stopped
    ports:
      - "8443:5601"
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USER=admin
      - INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD:-SecretPassword123!}
      - WAZUH_API_URL=https://wazuh.manager:55000
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=wazuh-wui
    depends_on:
      - wazuh.indexer
      - wazuh.manager
    networks:
      - skynet-wazuh-net

networks:
  skynet-wazuh-net:
    name: skynet-wazuh-net
    driver: bridge

volumes:
  wazuh_api_config:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_indexer_data:
